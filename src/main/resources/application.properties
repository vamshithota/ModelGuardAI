spring.application.name=Model-Guard
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
spring.ai.openai.api-key=${OPENAI_API_KEY}
slack.webhook-url=${SLACK_WEBHOOK_URL:}
spring.config.import=optional:classpath:prompts/v1.0.yml

# ===================================================================
# H2 Database Configuration
# ===================================================================
# File-based persistence so data survives application restarts
spring.datasource.url=jdbc:h2:file:./data/evaldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# H2 Web Console Configuration
# ===================================================================
# Enables inspecting database tables at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false